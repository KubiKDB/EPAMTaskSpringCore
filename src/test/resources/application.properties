spring.datasource.url=jdbc:h2:mem:gymcrm;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=200
management.metrics.tags.application=taskspringcore
management.metrics.tags.environment=test
management.info.env.enabled=true

info.app.name=Gym CRM
info.app.description=Gym CRM REST API with trainee, trainer and training management
