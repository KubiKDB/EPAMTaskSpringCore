spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gymcrm_stg}
spring.datasource.username=${DB_USERNAME:gym}
spring.datasource.password=${DB_PASSWORD:gym}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.environment=stg

logging.level.com.daniel.taskspringcore=INFO
